    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;display:flex;align-items:center;justify-content:center;height:100%">
      ${mathml}
    </div>
  </foreignObject>
</svg>`;
          const { filePath } = await ipcRenderer.invoke("save-mermaid-svg", svg);
          if (filePath) {
            dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            setTimeout(() => {
              dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
            }, 1500);
          }
        });

        toolbar.append(copyBtn, dlBtn);
        wrap.appendChild(toolbar);
      });
    }

    async function renderMermaidDiagrams(container) {
      const diagrams = container.querySelectorAll(".mermaid[data-mermaid-id]");
      for (const el of diagrams) {
        const id = el.getAttribute("data-mermaid-id");
        const source = el.textContent;
        try {
          const { svg } = await mermaid.render(id, source);
          el.innerHTML = svg;
          el.removeAttribute("data-mermaid-id");

          // Add toolbar with copy and download buttons
          const toolbar = document.createElement("div");
          toolbar.className = "mermaid-toolbar";

          const copyBtn = document.createElement("button");
          copyBtn.title = "Copy Mermaid source";
          copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          copyBtn.addEventListener("click", async () => {
            await ipcRenderer.invoke("copy-to-clipboard", source);
            copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            setTimeout(() => {
              copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
            }, 1500);
          });

          const dlBtn = document.createElement("button");
          dlBtn.title = "Download SVG";
          dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
          dlBtn.addEventListener("click", async () => {
            // Re-render for export
            const lightId = "mermaid-light-" + Math.random().toString(36).slice(2, 10);
            const result = await mermaid.render(lightId, source);
            const lightSvg = result.svg;
            const { filePath } = await ipcRenderer.invoke("save-mermaid-svg", lightSvg);
            if (filePath) {
              dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
              setTimeout(() => {
                dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
              }, 1500);
            }
          });

          toolbar.append(copyBtn, dlBtn);
          el.appendChild(toolbar);
        } catch (e) {
          el.innerHTML = `<pre class="mermaid-error">${e.message || "Mermaid rendering failed"}</pre>`;
          el.removeAttribute("data-mermaid-id");
        }
      }
    }

    // ── Save helper ────────────────────────────────────────────────────────────
    async function saveTab(id) {
      const tab = tabs[id];
      if (!tab || tab.chatLog.length === 0) return true;
      const savedMessages = [];
      for (const entry of tab.chatLog) {
        const msg = { role: entry.role, content: entry.content, images: [], timestamp: entry.timestamp ?? nowEpoch() };
        if (entry.generatedImageUrl) {
          try {
            const res = await fetch(entry.generatedImageUrl);
            const blob = await res.blob();
            const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(blob); });
            msg.images.push(dataUrl); msg.generatedImage = true;
          } catch { msg.images.push(entry.generatedImageUrl); msg.generatedImage = true; }
        } else {
          msg.images = entry.images || [];
        }
        savedMessages.push(msg);
      }
      const ok = await ipcRenderer.invoke("save-chat-dialog", { messages: savedMessages, title: tab.title, vendor: tab.vendor || vendorSel.value, model: tab.model || modelSel.value });
      if (ok) markSaved(id);
      return ok;
    }

    // ── File menu IPC ──────────────────────────────────────────────────────────
    ipcRenderer.on("new-tab", () => createTab());

    ipcRenderer.on("settings-updated", () => {
      ipcRenderer.invoke("get-vendors-and-settings").then(({ settings }) => {
        defaultToLang   = settings.defaultToLang   || "English";
        ttsVoice        = settings.ttsVoice        || "";
        displayModelActivity = settings.displayModelActivity !== false;
        if (settings.defaultModels) Object.assign(rememberedModel, settings.defaultModels);
        rememberedModel[settings.vendor] = settings.defaultModels?.[settings.vendor] || settings.model;
        defaultVendor = settings.vendor;
        applyColors(settings);
        applyTheme(settings);
        applyFonts(settings);
        updateMicAvailability();
      });
    });

    function applyColors(settings) {
      const accent     = settings.accentColor    || "#5cda05";
      const userBubble = settings.userBubbleColor || "#5cda05";
      const aiBubble   = settings.aiBubbleColor   || "#2c2c2e";
      const accentDark = shadeColor(accent, -15);
      const userText   = settings.userTextColor || contrastColor(userBubble);
      const aiText     = settings.aiTextColor   || contrastColor(aiBubble);
      document.getElementById("theme").textContent = `:root {
        --accent: ${accent};
        --accent-dark: ${accentDark};
        --user-bubble: ${userBubble};
        --user-bubble-text: ${userText};
        --ai-bubble: ${aiBubble};
        --ai-bubble-text: ${aiText};
      }`;
    }

    function applyTheme(settings) {
      const theme = settings.theme || "light";
      const href = theme === "dark" ? "resources/styles_dark.css" : "resources/styles.css";
      document.getElementById("theme-stylesheet").href = href;
    }

    function applyFonts(settings) {
      const textFont = settings.textFont || "";
      const textSize = settings.textFontSize || "14";
      const codeFont = settings.codeFont || "";
      const codeSize = settings.codeFontSize || "13";
      let fontStyle = document.getElementById("font-theme");
      if (!fontStyle) {
        fontStyle = document.createElement("style");
        fontStyle.id = "font-theme";
        document.head.appendChild(fontStyle);
      }
      const textFamily = textFont ? `"${textFont}", Calibri, Helvetica, sans-serif` : "-apple-system, sans-serif";
      const codeFamily = codeFont ? `"${codeFont}", 'JetBrains Mono',monospace` : "'JetBrains Mono', monospace";
      fontStyle.textContent = `
        body, .msg { font-family: ${textFamily}; font-size: ${textSize}px; }
        .msg.assistant code, .msg.assistant pre code, .tool-card-args, .tool-card-result, .agent-activity-detail { font-family: ${codeFamily}; font-size: ${codeSize}px; }
      `;
    }

    function shadeColor(hex, pct) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.min(255, Math.max(0, (n >> 16) + pct));
      const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
      const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
      return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
    }

    function contrastColor(hex) {
      const n = parseInt(hex.slice(1), 16);
      const r = ((n >> 16) & 0xff) / 255;
      const g = ((n >> 8) & 0xff) / 255;
      const b = (n & 0xff) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const lightness = (max + min) / 2;
      return lightness >= 0.65 ? "#000" : "#fff";
    }

    ipcRenderer.on("close-tab", () => { if (activeTabId) closeTab(activeTabId); });

    ipcRenderer.on("export-chat", async (_event, format) => {
      const tab = activeTab();
      if (!tab || tab.chatLog.length === 0) return;
      const messages = [];
      for (const entry of tab.chatLog) {
        const msg = { role: entry.role, content: entry.content || "", images: [], generatedImage: false, timestamp: entry.timestamp };
        if (entry.generatedImageUrl) {
          try {
            const res = await fetch(entry.generatedImageUrl);
            const blob = await res.blob();
            const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(blob); });
            msg.images.push(dataUrl); msg.generatedImage = true;
          } catch { msg.images.push(entry.generatedImageUrl); msg.generatedImage = true; }
        } else {
          msg.images = entry.images || [];
        }
        messages.push(msg);
      }
      if (format === "html")     await ipcRenderer.invoke("export-html",     { messages, title: tab.title });
      if (format === "markdown") await ipcRenderer.invoke("export-markdown", { messages, title: tab.title });
      if (format === "pdf")      await ipcRenderer.invoke("export-pdf");
    });

    ipcRenderer.on("save-chat", async () => {
      if (activeTabId) await saveTab(activeTabId);
    });

// ── Window close check ─────────────────────────────────────────────────────
    ipcRenderer.on("check-unsaved-before-close", async () => {
      const unsavedTabs = Object.values(tabs).filter(t => !t.saved && t.chatLog.length > 0);
      if (unsavedTabs.length === 0) {
        ipcRenderer.send("close-confirmed");
        return;
      }
      const names = unsavedTabs.map(t => `"${t.title}"`).join(", ");
      const { response } = await ipcRenderer.invoke("confirm-close-window", { names });
      if (response === 0) {
        // save all unsaved tabs
        for (const t of unsavedTabs) {
          const ok = await saveTab(t.id);
          if (!ok) return; // user cancelled a save dialog — abort close
        }
        ipcRenderer.send("close-confirmed");
      } else if (response === 1) {
        ipcRenderer.send("close-confirmed"); // close without saving
      }
      // response === 2 → cancel, do nothing
    });

    // ── Drag-and-drop IPC (receive tab from another window) ───────────────────
    ipcRenderer.on("receive-tab", (_event, state) => {
      createTab(state.title, state);
    });

    ipcRenderer.on("open-chat-tab", (_event, data) => {
      createTab(data.title || "Chat", data);
    });

    // ── .chat file drag-and-drop onto window ───────────────────────────────────
    document.addEventListener("dragover", e => {
      if ([...e.dataTransfer.items].some(i => i.kind === "file")) e.preventDefault();
    });
    document.addEventListener("drop", async e => {
      const file = [...e.dataTransfer.files].find(f => f.name.endsWith(".chat"));
      if (!file) return;
      e.preventDefault();
      e.stopPropagation();
      try {
        const text = await file.text();
        const raw = JSON.parse(text);
        const title = file.name.replace(/\.chat$/, "");
        const data = { ...raw, chatLog: raw.chatLog ?? raw.messages ?? [], title };
        createTab(data.title || "Chat", data);
      } catch (err) {
        console.error("Failed to load .chat file:", err);
      }
    });

    ipcRenderer.on("remove-tab-after-drag", (_event, tabId) => {
      // Remove without unsaved-changes prompt (it moved to another window)
      const tab = tabs[tabId];
      if (!tab) return;
      const tabIds = Object.keys(tabs).map(Number);
      const idx = tabIds.indexOf(tabId);
      tab.domEl.remove();
      delete tabs[tabId];
      const remaining = Object.keys(tabs).map(Number);
      if (remaining.length === 0) {
        createTab();
      } else if (activeTabId === tabId) {
        activeTabId = null;
        switchTab(remaining[Math.min(idx, remaining.length - 1)]);
      }
    });

    // ── Keyboard / button wiring ───────────────────────────────────────────────
    sendBtn.addEventListener("click", send);

    // ── Microphone / speech-to-text ─────────────────────────────────────────────
    // ── Microphone / Whisper speech-to-text ───────────────────────────────────────
    const micBtn = document.getElementById("mic-btn");
    let mediaRecorder = null;
    let audioChunks = [];

    function updateMicAvailability() {
      ipcRenderer.invoke("get-vendors-and-settings").then(({ settings }) => {
        const hasKey = !!(settings.apiKeys?.openai);
        micBtn.disabled = !hasKey;
        micBtn.style.opacity = hasKey ? "" : "0.35";
        micBtn.title = hasKey ? "Speak (Whisper)" : "Speak (requires OpenAI API key)";
        micBtn.style.cursor = hasKey ? "" : "not-allowed";
      });
    }
    updateMicAvailability();

    micBtn.addEventListener("click", async () => {
      if (micBtn.disabled) return;

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          micBtn.classList.remove("recording");
          micBtn.disabled = true;
          micBtn.style.opacity = "0.35";

          const blob = new Blob(audioChunks, { type: "audio/webm" });
          const arrayBuffer = await blob.arrayBuffer();
          const base64 = Buffer.from(arrayBuffer).toString("base64");

          try {
            const text = await ipcRenderer.invoke("whisper-transcribe", { base64, mimeType: "audio/webm" });
            if (text) {
              prompt.value = (prompt.value + " " + text).trim();
              prompt.style.height = "auto";
              prompt.style.height = Math.min(prompt.scrollHeight, 120) + "px";
            }
          } catch (err) {
            const tab = activeTab();
            if (tab) addMessage("error", "Voice input error: " + err.message, tab.id);
          } finally {
            updateMicAvailability();
          }
        };

        mediaRecorder.start();
        micBtn.classList.add("recording");
      } catch (err) {
        console.error("Mic error:", err.message);
      }
    });

    prompt.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && speechSynthesis.speaking) {
        speechSynthesis.cancel();
        document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
      }
    });

    prompt.addEventListener("input", () => {
      prompt.style.height = "auto";
      prompt.style.height = Math.min(prompt.scrollHeight, 120) + "px";
      sendBtn.disabled = !prompt.value.trim();
    });

    // prevent drag-and-drop into textarea
    prompt.addEventListener("dragover", e => e.preventDefault());
    prompt.addEventListener("drop", e => e.preventDefault());
  </script>
</body>
