<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="disable-code-actions" content="true">
  <title>NeuroPanther Chat</title>
  <link rel="stylesheet" href="node_modules/highlight.js/styles/github.css" media="screen">
  <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
  <link id="theme-stylesheet" rel="stylesheet" href="resources/styles.css">
  <style id="theme">
    :root {
      --accent: #5cda05;
      --accent-dark: #4ab804;
      --user-bubble: #5cda05;
      --user-bubble-text: #fff;
      --ai-bubble: #2c2c2e;
      --ai-bubble-text: #fff;
    }
  </style>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-BoldItalic.woff2') format('woff2');
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }
    @media print {
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #fff; color: #000; font-family: -apple-system, sans-serif; height: auto !important; overflow: visible !important; }
      #input-area, #attachment-preview-wrap, .msg-actions, .code-toolbar, .mermaid-toolbar, .table-toolbar, .math-block-toolbar { display: none !important; }
      #chat { display: block; padding: 0; height: auto !important; overflow: visible !important; }
      .msg { max-width: 100%; border-radius: 0; margin-bottom: 12px; padding: 8px 12px; page-break-inside: avoid; }
      .msg.user { background: #e8f0fe; color: #000; text-align: right; }
      .msg.assistant { background: #f5f5f5; color: #000; }
      .msg.assistant code { background: #eee; color: #000; }
      .msg.assistant pre { background: #eee; border: 1px solid #ccc; overflow: visible !important; }
      .msg.assistant pre code { background: none; color: #000; }
      .msg img { max-width: 100%; }
      a { color: #000; }
      ::-webkit-scrollbar { display: none; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, sans-serif;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.user      { align-self: flex-end; background: var(--user-bubble); color: var(--user-bubble-text); white-space: pre-wrap; }
    .msg.assistant { align-self: flex-start; background: var(--ai-bubble); color: var(--ai-bubble-text); }
    .msg.error     { align-self: flex-start; }
    .msg.info      { align-self: center; background: transparent; font-size: 14px; padding: 4px 0; }

    .msg.assistant p { margin: 0 0 8px; }
    .msg.assistant p:last-child { margin-bottom: 0; }
    .msg.assistant ul, .msg.assistant ol { margin: 0 0 8px 20px; }
    .msg.assistant li { margin-bottom: 2px; }
    .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 8px 0 4px; }
    .msg.assistant code { padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
    .msg.assistant pre { 
      margin: 8px 0; 
      border-radius: 8px; 
      overflow-x: auto; 
      position: relative; 
      -webkit-user-select: text; 
      user-select: text;
      min-height: 40px;
      padding: 10px;
    }
    .msg.assistant pre::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .msg.assistant pre code { 
      background: none;
      padding: 0; 
      -webkit-user-select: text; 
      user-select: text;
    }
    pre, code { -webkit-user-modify: read-only; }
    
    /* Disable Chromium's code block actions menu */
    pre::-webkit-details-marker { display: none !important; }
    code::-webkit-details-marker { display: none !important; }
    
    /* Hide any code action UI elements */
    code-action, code-action-button, [class*="code-action"] { display: none !important; }
    pre::part(code-action), code::part(code-action) { display: none !important; }
    .code-toolbar {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .msg.assistant pre:hover .code-toolbar { opacity: 1; }
    .code-toolbar button {
      border: none;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .msg.assistant blockquote { border-left: 3px solid; padding-left: 10px; margin: 6px 0; }
    .msg.assistant table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
    .msg.assistant th { padding: 8px 12px; text-align: left; border: 1px solid; }
    .msg.assistant td { padding: 8px 12px; border: 1px solid; }
    .table-wrap { position: relative; }
    .table-toolbar {
      position: absolute;
      top: -2px;
      right: 0;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .table-wrap:hover .table-toolbar { opacity: 1; }
    .table-toolbar button {
      border: none;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .msg.assistant a { color: var(--accent); }
    .msg.assistant .katex-display { overflow-x: auto; overflow-y: hidden; }
    .math-block-wrap { position: relative; }
    .math-block-toolbar {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .math-block-wrap:hover .math-block-toolbar { opacity: 1; }
    .math-block-toolbar button {
      border: none;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-preview {
      position: fixed;
      z-index: 1000;
      border: 1px solid;
      border-radius: 8px;
      padding: 8px;
      pointer-events: none;
      max-width: 300px;
    }
    .link-preview img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
    }
    .link-preview-loading { font-size: 14px;
      padding: 20px;
    }

    .msg img { max-width: 100%; border-radius: 10px; display: block; margin-top: 6px; cursor: zoom-in; }
    .msg img.emoji { display: inline-block; height: 1.2em; width: 1.2em; vertical-align: -0.2em; margin: 0 0.05em; border-radius: 0; cursor: default; }

    #img-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #img-modal.visible { display: flex; }
    #img-modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }

    .msg-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid;
    }
    .msg-actions button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .msg-actions button.speaking { color: var(--accent); }

    #attachment-preview-wrap {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-top: 1px solid;
    }
    .attach-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 14px;
      max-width: 200px;
    }
    .attach-badge img { height: 40px; border-radius: 4px; flex-shrink: 0; }
    .attach-badge-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-badge-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      padding: 0 2px;
    }
    #chat.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }

    #translate-row {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-top: 1px solid;
    }
    #translate-row.visible { display: flex; }
    #translate-row label { font-size: 14px; flex-shrink: 0; }
    #translate-row select {
      border: none;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    #agent-row {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-top: 1px solid;
      font-size: 14px;
    }
    #agent-row.visible { display: flex; }
    #agent-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #agent-row button { border: none; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0; }

    .tool-card {
      align-self: flex-start;
      border: 1px solid;
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 75%;
      font-size: 14px;
    }
    .tool-card-header { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .tool-card-args { font-family: 'JetBrains Mono', monospace; font-size: 11px; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }
    .tool-card-result { font-family: 'JetBrains Mono', monospace; font-size: 11px; border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
    .tool-card-btns { display: flex; gap: 8px; margin-top: 8px; }
    .tool-allow-btn { border: none; border-radius: 6px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
    .tool-deny-btn  { border: none; border-radius: 6px; padding: 4px 12px; font-size: 14px; cursor: pointer; }

    @keyframes pulse-dim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .thinking-indicator {
      align-self: flex-start;
      background: none !important;
      padding: 4px 0 !important;
    }
    .thinking-indicator img {
      width: 32px;
      height: 32px;
      border-radius: 0 !important;
      animation: pulse-dim 1.6s ease-in-out infinite;
      margin: 0 !important;
    }
    .thinking-text {
      display: inline-block;
      vertical-align: middle;
      margin-left: 10px;
      font-size: 14px;
      font-style: italic;
    }
    .thinking-cancel {
      display: inline-block;
      vertical-align: middle;
      margin-left: auto;
      padding: 2px 6px;
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      border-radius: 4px;
    }
    .thinking-indicator {
      display: flex !important;
      align-items: center;
    }

    .agent-activity {
      align-self: flex-start;
      max-width: 75%;
      border: 1px solid;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
    }
    .agent-activity-header { font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .agent-activity-detail {
      margin-top: 6px;
      border-radius: 6px;
      padding: 6px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
    }
    .think-block {
      margin: 0 0 10px 0;
      border: 1px solid;
      border-radius: 10px;
      overflow: hidden;
    }
    .think-block-title {
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .think-block-body {
      padding: 8px 10px;
      font-size: 14px;
      font-style: italic;
    }
    .think-block-body > :first-child { margin-top: 0; }
    .think-block-body > :last-child { margin-bottom: 0; }

    #input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .icon-btn.active { background: var(--accent); color: #fff; }
    .icon-btn.recording { background: #ff453a; color: #fff; animation: pulse-dim 1s ease-in-out infinite; }
    .icon-btn svg { pointer-events: none; }

    #prompt {
      flex: 1;
      resize: none;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
    }

    #vendor-select, #model-select, #image-model-select {
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    #vendor-select:disabled, #model-select:disabled, #image-model-select:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #vendor-select { max-width: 100px; }
    #model-select  { max-width: 140px; }
    #image-model-select { max-width: 180px; }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #tab-bar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid;
      min-height: 36px;
      -webkit-app-region: drag;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    #tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px 0 14px;
      min-width: 100px;
      max-width: 200px;
      border-right: 1px solid;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      position: relative;
      user-select: none;
    }
    .tab.active { border-bottom: 2px solid var(--accent); }
    .tab.drag-over { background: #0a84ff33; }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-title-input {
      flex: 1;
      font-size: 14px;
      border: 1px solid;
      border-radius: 4px;
      padding: 1px 6px;
      outline: none;
      display: none;
      min-width: 0;
    }
    .tab-close {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      -webkit-app-region: no-drag;
    }
    .tab.unsaved .tab-title::after { content: " •"; color: var(--accent); }

    #new-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    #send-btn:hover    { background: var(--accent-dark); }
    #send-btn:disabled { cursor: default; }
    #send-btn svg { pointer-events: none; }

    .mermaid { position: relative; border-radius: 8px; overflow: visible; background: #fff; padding: 12px; }
    .mermaid svg { max-width: 100%; margin: 8px 0; }
    .mermaid-error { font-size: 12px; white-space: pre-wrap; }
    .mermaid-toolbar {
      position: absolute;
      top: 14px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 10;
    }
    .mermaid:hover .mermaid-toolbar { opacity: 1; }
    .mermaid-toolbar button {
      border: none;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 21px;
    }
  </style>
</head>
<body>
  <div id="img-modal"><img id="img-modal-img"></div>

  <div id="tab-bar">
    <!-- tabs injected here -->
    <button id="new-tab-btn" title="New Tab">+</button>
  </div>
  <div id="chat"></div>

  <div id="attachment-preview-wrap"></div>

  <div id="input-area">
    <select id="vendor-select" title="Vendor"></select>
    <select id="model-select" title="Model"></select>
    <select id="image-model-select" title="Image Model" style="display:none"></select>
    <button class="icon-btn" id="attach-btn" title="Attach file(s)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
    </button>
    <button class="icon-btn" id="imagine-btn" title="Generate Image">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button class="icon-btn" id="agent-btn" title="Agent Mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="16" height="12" rx="2"/><line x1="12" y1="8" x2="12" y2="4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="14" r="1.5"/><circle cx="15" cy="14" r="1.5"/><line x1="1" y1="13" x2="4" y2="13"/><line x1="20" y1="13" x2="23" y2="13"/>
      </svg>
    </button>
    <button class="icon-btn" id="translate-btn" title="Translate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
        <path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/>
      </svg>
    </button>
    <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
    <button id="mic-btn" class="icon-btn" title="Speak">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button id="send-btn" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 10 4 15 9 20"/>
        <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
      </svg>
    </button>
  </div>

  <div id="translate-row">
    <label>Respond in</label>
    <select id="to-lang"></select>
  </div>

  <div id="agent-row">
    <span id="agent-dir-label">No working directory set</span>
    <button id="agent-dir-btn">Set Directory</button>
  </div>

  <input type="file" id="file-input" multiple style="display:none">

  <script>
    const { ipcRenderer, shell } = require("electron");
    const { marked } = require("marked");
    const hljs = require("highlight.js");
    const mermaid = require("mermaid").default;
    mermaid.initialize({ startOnLoad: false, theme: "default", suppressErrorRendering: true });

    // Pre-warm speech synthesis voices (loads asynchronously on Linux)
    speechSynthesis.getVoices();

    // Remove Chromium code action elements
    const observer = new MutationObserver(() => {
      document.querySelectorAll('[class*="code-action"], code-action, code-action-button').forEach(el => el.remove());
    });
    observer.observe(document.body, { childList: true, subtree: true });

    const katex = require("katex");

    marked.use({
      extensions: [
        {
          name: "mathBlock",
          level: "block",
          start(src) { return src.indexOf("$$"); },
          tokenizer(src) {
            const match = src.match(/^\$\$([\s\S]+?)\$\$/);
            if (match) return { type: "mathBlock", raw: match[0], text: match[1].trim() };
          },
          renderer(token) {
            const rendered = katex.renderToString(token.text, { displayMode: true, throwOnError: false });
            return `<div class="math-block-wrap" data-latex="${token.text.replace(/"/g, "&quot;")}">${rendered}</div>`;
          }
        },
        {
          name: "mathInline",
          level: "inline",
          start(src) { return src.indexOf("$"); },
          tokenizer(src) {
            const match = src.match(/^\$([^\$\n]+?)\$/);
            if (match && !/^\d/.test(match[1]) && !/^\s|\s$/.test(match[1])) return { type: "mathInline", raw: match[0], text: match[1] };
          },
          renderer(token) {
            return katex.renderToString(token.text, { displayMode: false, throwOnError: false });
          }
        }
      ],
      renderer: (() => {
        const r = new marked.Renderer();
        r.code = ({ text, lang }) => {
          if (lang === "mermaid") {
            const id = "mermaid-" + Math.random().toString(36).slice(2, 10);
            return `<div class="mermaid" data-mermaid-id="${id}">${text}</div>`;
          }
          const language = hljs.getLanguage(lang) ? lang : "plaintext";
          return `<pre><code class="hljs language-${language}">${hljs.highlight(text, { language }).value}</code></pre>`;
        };
        r.table = function({ header, rows }) {
          let html = `<div class="table-wrap"><table><thead><tr>`;
          for (const cell of header) {
            const align = cell.align ? ` style="text-align:${cell.align}"` : "";
            html += `<th${align}>${this.parser.parseInline(cell.tokens)}</th>`;
          }
          html += `</tr></thead><tbody>`;
          for (const row of rows) {
            html += `<tr>`;
            for (const cell of row) {
              const align = cell.align ? ` style="text-align:${cell.align}"` : "";
              html += `<td${align}>${this.parser.parseInline(cell.tokens)}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
          return html;
        };
        return r;
      })()
    });

    function createTab(title = "New Chat", restore = null) {
      const id = ++tabIdCounter;

      // each tab owns a persistent container div
      const container = document.createElement("div");
      container.style.cssText = "display:flex;flex-direction:column;gap:10px;width:100%;";

      const tab = {
        id,
        title: title,
        history: restore ? restore.history || restore.messages
            .filter(m => m.role !== "system" && m.content)
            .map(m => ({ role: m.role, content: m.content })) : [],
        chatLog: restore ? restore.chatLog : [],
        saved: restore ? true : false,
        imagineMode: false,
        lastGeneratedImageBase64: null,
        translateMode: defaultToLang !== "English",
        toLang: defaultToLang,
        agentMode: false,

        promptText: "",
        attachedFiles: [],
        vendor: restore ? restore.vendor : null,
        model: restore ? restore.model : null,
        domEl: null,
        container   // persistent chat container
      };
      tabs[id] = tab;

      // build tab DOM element
      const el = document.createElement("div");
      el.className = "tab";
      el.dataset.tabId = id;
      el.draggable = true;

      const titleSpan = document.createElement("span");
      titleSpan.className = "tab-title";

      closeBtn.textContent = "×";
      closeBtn.addEventListener("click", e => { e.stopPropagation(); closeTab(id); });

      el.append(titleSpan, titleInput, closeBtn);
      el.addEventListener("click", () => switchTab(id));

      // rename on double-click
      titleSpan.addEventListener("dblclick", e => {
        e.stopPropagation();
        titleInput.value = tab.title;
        titleSpan.style.display = "none";
        titleInput.style.display = "block";
        titleInput.focus();
        titleInput.select();
      });
      titleInput.addEventListener("keydown", e => {
        if (e.key === "Enter") commitTabTitle(id);
        if (e.key === "Escape") { titleInput.style.display = "none"; titleSpan.style.display = ""; }
      });
      titleInput.addEventListener("blur", () => commitTabTitle(id));

      // drag-and-drop
      el.addEventListener("dragstart", e => {
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", id);
        ipcRenderer.send("tab-drag-start", { tabId: id, state: serializeTab(id), tabCount: Object.keys(tabs).length });
      });
      el.addEventListener("dragend", () => {
        ipcRenderer.send("tab-drag-end", { tabId: id });
      });

      tab.domEl = el;
      // insert before the + button
      tabBar.insertBefore(el, newTabBtn);

      if (restore) {
        // rebuild chat DOM directly (avoid innerHTML truncating large base64 image src)
        buildChatDom(restore.chatLog, container);
        renderMermaidDiagrams(container);
      }

      switchTab(id);
      return id;

    function commitTabTitle(id) {
      const tab = tabs[id];
      if (!tab) return;
      const titleInput = tab.domEl.querySelector(".tab-title-input");
      const titleSpan  = tab.domEl.querySelector(".tab-title");
      const val = titleInput.value.trim();
      if (val) {
        tab.title = val;
        titleSpan.textContent = val;
        if (id === activeTabId) document.title = "NeuroPanther Chat";
      }
      titleInput.style.display = "none";
      titleSpan.style.display = "";
    }

    function markUnsaved(id) {
      const tab = tabs[id];
      if (!tab || tab.saved === false) return;
      tab.saved = false;
      tab.domEl.classList.add("unsaved");
    }

    function markSaved(id) {
      const tab = tabs[id];
      if (!tab) return;
      tab.saved = true;
      tab.domEl.classList.remove("unsaved");
    }

    function switchTab(id) {
      if (activeTabId === id) return;

      // save vendor/model/prompt of outgoing tab
      if (activeTabId && tabs[activeTabId]) {
        tabs[activeTabId].vendor     = vendorSel.value;
        tabs[activeTabId].model      = modelSel.value;
        tabs[activeTabId].promptText = prompt.value;
        tabs[activeTabId].domEl.classList.remove("active");
      }

      // clear chatEl completely before attaching new container
      while (chatEl.firstChild) chatEl.removeChild(chatEl.firstChild);

      activeTabId = id;
      const tab = tabs[id];
      tab.domEl.classList.add("active");
      document.title = "NeuroPanther Chat";

      // attach this tab's container
      chatEl.appendChild(tab.container);
      chatEl.scrollTop = chatEl.scrollHeight;

      // sync imagine mode UI
      imagineBtn.classList.toggle("active", tab.imagineMode);
      prompt.placeholder = tab.imagineMode ? "Describe an image to generate…" : "Message…";

      // sync translate mode UI
      translateBtn.classList.toggle("active", tab.translateMode);
      translateRow.classList.toggle("visible", tab.translateMode);
      toLangSel.value   = tab.toLang   || defaultToLang;

      // sync agent mode UI
      agentBtn.classList.toggle("active", tab.agentMode);
      agentRow.classList.toggle("visible", tab.agentMode);

      // sync vendor/model lock
      applyVendorLock(tab);

      // repopulate vendor list filtered by this tab's imagineMode, then restore vendor/model
      const targetVendor = tab.vendor || defaultVendor || vendorSel.value;
      populateVendorSelectOnly(allVendors, targetVendor, tab.imagineMode);
      if (tab.model) modelSel.value = tab.model;
      fetchAndPopulateModels(vendorSel.value, tab.model || null).then(() => {
        modelSel.style.display = tab.imagineMode ? "none" : "";
        imageModelSel.style.display = tab.imagineMode ? "" : "none";
        if (tab.imagineMode) populateImageModelSelect(vendorSel.value);
      });

      clearAttachments();
      // restore attachment badges for this tab
      for (const entry of (tab.attachedFiles || [])) addAttachBadge(tab, entry);
      prompt.value = tab.promptText || "";
      prompt.style.height = "auto";
      if (prompt.value) prompt.style.height = Math.min(prompt.scrollHeight, 120) + "px";
      sendBtn.disabled = !prompt.value.trim();
      prompt.focus();
    }

    function activeTab() { return tabs[activeTabId]; }

    function applyVendorLock(tab) {
      const locked = tab ? (tab.locked && !tab.imagineMode) : false;
      vendorSel.disabled = locked;
      modelSel.disabled  = locked;
      imageModelSel.disabled = locked;
      const tip = locked ? "Vendor/model locked — start a new tab to change" : "";
      vendorSel.title = tip;
      modelSel.title  = tip;
      imageModelSel.title = tip;

    async function closeTab(id) {
      const tab = tabs[id];
      if (!tab) return;

      if (!tab.saved && tab.chatLog.length > 0) {
        const { response } = await ipcRenderer.invoke("confirm-close-tab", { title: tab.title });
        if (response === 0) {
          // Save first
          const saved = await saveTab(id);
          if (!saved) return; // user cancelled save dialog
        } else if (response === 2) {
          return; // Cancel
        }
        // response === 1 → close without saving
      }

      const tabIds = Object.keys(tabs).map(Number);
      const idx = tabIds.indexOf(id);

      tab.domEl.remove();
      delete tabs[id];

      const remaining = Object.keys(tabs).map(Number);
      if (remaining.length === 0) {
        window.close();
      } else if (activeTabId === id) {
        // switch to adjacent tab
        const nextId = remaining[Math.min(idx, remaining.length - 1)];
        activeTabId = null;
        switchTab(nextId);
      }
    }

    function serializeTab(id) {
      const tab = tabs[id];
      if (!tab) return null;
      const vendor = (id === activeTabId) ? vendorSel.value : tab.vendor;
      const model  = (id === activeTabId) ? modelSel.value  : tab.model;
      return { title: tab.title, history: tab.history, chatLog: tab.chatLog, vendor, model };
    }

    function buildChatDom(chatLog, container) {
      for (const msg of chatLog) {
        if (msg.role === "user") {

            for (const src of msg.images) {
              const img = document.createElement("img");

              div.appendChild(img);

            const p = document.createElement("div");
            p.textContent = msg.content;
            if (msg.images?.length) p.style.marginTop = "6px";
            div.appendChild(p);
          }
          container.appendChild(div);
        } else if (msg.role === "info") {
          const div = document.createElement("div");
          div.className = "msg info";
          div.textContent = msg.content;
          container.appendChild(div);
        } else {
          const div = document.createElement("div");
          div.className = "msg assistant";
          if (msg.images?.length && (msg.generatedImage || !msg.content)) {
            const img = document.createElement("img");
            img.src = msg.images[0]; img.style.maxWidth = "200px";
            div.appendChild(img);
            div.appendChild(makeImageDownloadAction(msg.images[0], "image"));
          } else {
            div.innerHTML = replaceEmoji(marked.parse(msg.content || ""));
            addCodeCopyButtons(div);
            addTableToolbars(div);
            addMathBlockToolbars(div);
            div.appendChild(makeActions(msg.content || ""));
          }
          container.appendChild(div);
        }
      }
    }

    let ollamaAvailable = false;

    function populateVendorSelectOnly(vendors, selectedVendor, imagineOnly) {
      const current = selectedVendor || vendorSel.value;
      vendorSel.innerHTML = "";
      const entries = Object.entries(vendors)
        .filter(([, v]) => !(imagineOnly && !v.imageGeneration) && !(!imagineOnly && v.imageOnly))
        .sort((a, b) => a[1].label.localeCompare(b[1].label));
      for (const [key, v] of entries) {
        const opt = document.createElement("option");
        opt.value = key; opt.textContent = v.label;
        if (key === "ollama" && !ollamaAvailable) {
          opt.disabled = true;
          opt.textContent = "Ollama (not running)";
          opt.style.color = "#666";
        }
        vendorSel.appendChild(opt);
      }
      vendorSel.value = (current === "ollama" && !ollamaAvailable) ? Object.keys(vendors).find(k => k !== "ollama") || "" : current;
      if (!vendorSel.value) vendorSel.selectedIndex = 0;
      vendorSel.dataset.prev = vendorSel.value;
    }

    function populateVendorSelect(vendors, selectedVendor, imagineOnly) {
      populateVendorSelectOnly(vendors, selectedVendor, imagineOnly);
      fetchAndPopulateModels(vendorSel.value);

    const modelCache = {};  // vendor → models array

    async function fetchAndPopulateModels(vendor, targetModel = null) {
      const skipCache = vendor === "ibm" || vendor === "microsoft" || vendor === "amazon" || vendor.startsWith("generic");
      if (!modelCache[vendor] || skipCache) {
        modelSel.innerHTML = "<option disabled>Loading\u2026</option>";
        modelCache[vendor] = await ipcRenderer.invoke("get-models-for-vendor", vendor);
      }
      const models = modelCache[vendor];
      modelSel.innerHTML = "";
      if (!models || models.length === 0) {
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = "API Key Not Set"; opt.disabled = true;
        modelSel.appendChild(opt);
      } else {
        for (const m of [...models].sort((a, b) => a.localeCompare(b))) {
          const opt = document.createElement("option");
          opt.value = m; opt.textContent = m;
          modelSel.appendChild(opt);
        }
        const restore = targetModel || rememberedModel[vendor];
        if (restore && models.includes(restore)) {
          modelSel.value = restore;
        }
      }
    }

    modelSel.addEventListener("change", () => {
      rememberedModel[vendorSel.value] = modelSel.value;

    const rememberedImageModel = {};  // vendor → selected image model

    function populateImageModelSelect(vendor) {
      const vendorCfg = allVendors[vendor];

    // ── File attach ────────────────────────────────────────────────────────────
    const TEXT_EXTS = new Set([
      "txt","md","markdown","csv","tsv","json","jsonl","xml","yaml","yml",
      "html","htm","css","js","ts","jsx","tsx","py","rb","java","c","cpp",
      "h","hpp","cs","go","rs","swift","kt","sh","bash","zsh","fish","ps1",
      "sql","graphql","toml","ini","cfg","conf","env","log","diff","patch",
      "r","m","scala","clj","ex","exs","erl","hs","lua","pl","php","vue",
      "svelte","astro","tf","hcl","dockerfile","makefile","cmake","gradle"
    ]);
    const IMAGE_TYPES = new Set(["image/png","image/jpeg","image/gif","image/webp","image/svg+xml"]);
    let maxAttachmentSize = 52428800;
    ipcRenderer.invoke("get-config").then(cfg => { if (cfg?.maxAttachmentSize) maxAttachmentSize = cfg.maxAttachmentSize; });

    function processFiles(files) {
      const tab = activeTab();
      if (!tab) return;
      for (const file of files) {
        if (file.size > maxAttachmentSize) {
          alert(`"${file.name}" exceeds the ${Math.round(maxAttachmentSize / 1048576)}MB size limit and was not attached.`);
          continue;
        }
        const ext = file.name.split(".").pop().toLowerCase();
        const isImage = IMAGE_TYPES.has(file.type);
        const isText  = TEXT_EXTS.has(ext) || file.type.startsWith("text/");
        if (!isImage && !isText) {
          alert(`"${file.name}" is not a supported file type. Only images and text-based files can be attached.`);
          continue;
        }
        const reader = new FileReader();
        if (isImage) {
          reader.onload = e => {
            const dataUrl = e.target.result;
            const entry = { name: file.name, type: "image", mediaType: file.type, base64: dataUrl.split(",")[1], dataUrl };
            tab.attachedFiles.push(entry);
            addAttachBadge(tab, entry);
          };
          reader.readAsDataURL(file);
        } else {
          reader.onload = e => {
            const entry = { name: file.name, type: "text", content: e.target.result };
            tab.attachedFiles.push(entry);
            addAttachBadge(tab, entry);
          };
          reader.readAsText(file);
        }
      }
    }

    function addAttachBadge(tab, entry) {
      const badge = document.createElement("div");
      badge.className = "attach-badge";
      if (entry.type === "image") {
        const img = document.createElement("img");
        img.src = entry.dataUrl;
        badge.appendChild(img);
      } else {
        const icon = document.createElement("span");
        icon.textContent = "📄";
        badge.appendChild(icon);
      }
      const name = document.createElement("span");
      name.className = "attach-badge-name";
      name.textContent = entry.name;
      badge.appendChild(name);
      const rm = document.createElement("button");
      rm.className = "attach-badge-remove";
      rm.title = "Remove";
      rm.textContent = "✕";
      rm.addEventListener("click", () => {
        tab.attachedFiles = tab.attachedFiles.filter(f => f !== entry);
        badge.remove();
        if (!previewWrap.children.length) previewWrap.style.display = "none";
      });
      badge.appendChild(rm);
      previewWrap.appendChild(badge);
      previewWrap.style.display = "flex";
    }

    function clearAttachments() {
      const tab = activeTab();

    let prefetchPromise;
    
    document.addEventListener("mouseover", e => {
      const a = e.target.closest("a");
      if (!a || !a.href || !a.href.startsWith("http")) return;
      
      // Start fetching immediately
      if (!prefetchPromise) {
        prefetchPromise = ipcRenderer.invoke("get-link-preview", a.href);
      }
      
      clearTimeout(hoverTimeout);

        previewEl = document.createElement("div");
        previewEl.className = "link-preview";
        previewEl.innerHTML = '<div class="link-preview-loading">Loading preview...</div>';
        document.body.appendChild(previewEl);
        
        const rect = a.getBoundingClientRect();
        previewEl.style.left = rect.left + "px";
        previewEl.style.top = (rect.bottom + 8) + "px";
        
        try {
          const imageUrl = await prefetchPromise;
          if (imageUrl && previewEl.parentNode) {
            previewEl.innerHTML = `<img src="${imageUrl}" alt="Preview">`;
          } else if (previewEl.parentNode) {
            previewEl.remove();
          }
        } catch {
          if (previewEl.parentNode) previewEl.remove();
        }
      }, 2000);
    });
    
    document.addEventListener("mouseout", e => {
      const a = e.target.closest("a");

    // ── Send ───────────────────────────────────────────────────────────────────
    async function send() {
      const tab = activeTab();
      if (!tab) return;
      const text = prompt.value.trim();
      if (!text) return;

      prompt.value = "";
      prompt.style.height = "auto";
      sendBtn.disabled = true;

      // capture these now — user may switch tabs before the await resolves
      const tabId  = tab.id;
      const vendor = vendorSel.value;
      const model  = modelSel.value;

      if (tab.imagineMode) {
        const userDiv = document.createElement("div");
        userDiv.className = "msg user";
        const imageFile = tab.attachedFiles.find(f => f.type === "image");
        if (imageFile) {
          const imgEl = document.createElement("img");
          imgEl.src = imageFile.dataUrl; imgEl.style.maxWidth = "200px";
          userDiv.appendChild(imgEl);
        }
        const textEl = document.createElement("div");
        textEl.textContent = `🎨 ${text}`;
        if (imageFile) textEl.style.marginTop = "6px";
        userDiv.appendChild(textEl);
        tabs[tabId].container.appendChild(userDiv);
        if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
        tab.chatLog.push({ role: "user", content: `🎨 ${text}`, images: imageFile ? [imageFile.dataUrl] : [] });
        tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
        markUnsaved(tabId);
        const thinking = addMessage("assistant", "…", tabId);
        try {
          const sourceImageBase64 = imageFile?.base64 || tab.lastGeneratedImageBase64 || null;
          clearAttachments();
          // Build cumulative prompt from prior image-gen turns for iterative refinement
          let fullPrompt = text;
          if (sourceImageBase64) {
            const priorPrompts = tab.chatLog
              .filter(m => m.role === "user" && m.content.startsWith("🎨 "))
              .map(m => m.content.slice(2).trim());
            // Exclude the current prompt (just pushed above)
            priorPrompts.pop();
            if (priorPrompts.length) {
              fullPrompt = "Previous instructions for this image:\n" + priorPrompts.map((p, i) => `${i + 1}. ${p}`).join("\n") + "\n\nNew instruction: " + text;
            }
          }
          const url = await ipcRenderer.invoke("generate-image", { promptText: fullPrompt, vendor, sourceImageBase64, imageModel: imageModelSel.value });
          thinking.innerHTML = "";
          thinking.classList.remove("thinking-indicator");
          const img = document.createElement("img");
          img.src = url; img.style.maxWidth = "200px";
          thinking.appendChild(img);
          thinking.appendChild(makeImageDownloadAction(url, text));
          tab.chatLog.push({ role: "assistant", content: "", generatedImageUrl: url });
          tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
          tab.lastGeneratedImageBase64 = url.split(",")[1];
        } catch (err) {
          thinking.classList.remove("thinking-indicator");
          thinking.className = "msg error";
          thinking.textContent = "Error: " + err.message;
          tab.chatLog.pop();
        }
      } else if (tab.attachedFiles.length) {
        const files = tab.attachedFiles.slice();
        clearAttachments();

        // Build user bubble showing image thumbnails + file badges
        const userDiv = document.createElement("div");
        userDiv.className = "msg user";
        for (const f of files) {
          if (f.type === "image") {
            const imgEl = document.createElement("img");
            imgEl.src = f.dataUrl; imgEl.style.maxWidth = "200px";
            userDiv.appendChild(imgEl);
          } else {
            const badge = document.createElement("span");
            badge.style.cssText = "display:inline-block;background:#3a3a3c;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;";
            badge.textContent = `📄 ${f.name}`;
            userDiv.appendChild(badge);
          }
        }
        if (text) {
          const p = document.createElement("div");
          p.textContent = text; p.style.marginTop = "6px";
          userDiv.appendChild(p);
        }
        tab.container.appendChild(userDiv);
        if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
        tab.chatLog.push({ role: "user", content: text || "", images: files.filter(f => f.type === "image").map(f => f.dataUrl) });
        tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
        markUnsaved(tabId);

        // Build the user history message with inline file content
        const imageFiles = files.filter(f => f.type === "image");
        const textFiles  = files.filter(f => f.type === "text");
        let fileContext = "";
        for (const f of textFiles) {
          fileContext += `\n\n--- File: ${f.name} ---\n${f.content}`;
        }
        const userText = (text || "") + fileContext;

        if (!tab.locked) { tab.locked = true; applyVendorLock(tab); }
        const thinking = addMessage("assistant", "…", tabId);
        try {
          if (imageFiles.length === 1 && textFiles.length === 0) {
            // Single image — use existing chat-with-image path
            const img = imageFiles[0];
            const tempPath = await ipcRenderer.invoke("save-temp-image", { base64: img.base64, mediaType: img.mediaType });
            const reply = await ipcRenderer.invoke("chat-with-image", { tempPath, mediaType: img.mediaType, text: text || "What is in this image?", vendor, model });
            thinking.classList.remove("thinking-indicator");
            thinking.innerHTML = replaceEmoji(marked.parse(reply));
            addCodeCopyButtons(thinking);
            addTableToolbars(thinking);
            addMathBlockToolbars(thinking);
            renderMermaidDiagrams(thinking);
            thinking.appendChild(makeActions(reply));
            // Store image in history so follow-up messages include it
            tab.history.push({ role: "user", content: [
              { type: "image", mediaType: img.mediaType, base64: img.base64 },
              { type: "text", text: text || "What is in this image?" }
            ]});
            tab.history.push({ role: "assistant", content: reply });
            tab.chatLog.push({ role: "assistant", content: reply, images: [] });
            tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
          } else {
            // Text files, multiple images, or mixed — inject content as text
            tab.history.push({ role: "user", content: userText });
            tab.chatLog.push({ role: "user", content: userText, images: [] });
            tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
            if (tab.agentMode) {
              const today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
              const langInstruction = tab.translateMode ? `IMPORTANT: Always respond in ${tab.toLang}, regardless of the language the user writes in.\n\n` : "";
              const agentInstruction = `You are a helpful AI assistant with access to tools. Today's date is ${today}. Use tools as needed to answer the user's request.`;
              const sysContent = `${langInstruction}${agentInstruction}${baseSystemPrompt ? "\n\n" + baseSystemPrompt : ""}`;
              if (!tab.history.length || tab.history[0].role !== "system") {
                tab.history.unshift({ role: "system", content: sysContent });
              } else {
                tab.history[0].content = sysContent;
              }
              await runAgentLoop(tab, tabId, vendor, model, thinking);
            } else {
              const langInstruction = tab.translateMode ? `IMPORTANT: Always respond in ${tab.toLang}, regardless of the language the user writes in.` : "";
              if (baseSystemPrompt || langInstruction) {
                const sysContent = [langInstruction, baseSystemPrompt].filter(Boolean).join("\n\n");
                if (!tab.history.length || tab.history[0].role !== "system") {
                  tab.history.unshift({ role: "system", content: sysContent });
                } else {
                  tab.history[0].content = sysContent;
                }
              }
              await runStreaming(tab, tabId, vendor, model, thinking);
            }
          }
        } catch (err) {
          thinking.style.display = "";
          thinking.classList.remove("thinking-indicator");
          thinking.className = "msg error";
          thinking.textContent = "Error: " + err.message;
          tab.chatLog.pop();
        }
      } else {
        addMessage("user", text, tabId);
        if (tab.translateMode) {
          const sysContent = `IMPORTANT: Always respond in ${tab.toLang}, regardless of the language the user writes in.\n\n${baseSystemPrompt || ""}`.trim();
          if (!tab.history.length || tab.history[0].role !== "system") {
            tab.history.unshift({ role: "system", content: sysContent });
          } else {
            tab.history[0].content = sysContent;
          }
        } else if (baseSystemPrompt) {
          if (!tab.history.length || tab.history[0].role !== "system") {
            tab.history.unshift({ role: "system", content: baseSystemPrompt });
          } else {
            tab.history[0].content = baseSystemPrompt;
          }
        }
        tab.history.push({ role: "user", content: text });
        tab.chatLog.push({ role: "user", content: text, images: [] });
        tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
        markUnsaved(tabId);
        if (!tab.locked) { tab.locked = true; applyVendorLock(tab); }
        const thinking = addMessage("assistant", "…", tabId);
        try {
        if (tab.agentMode) {
          const today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
          const langInstruction = tab.translateMode ? `IMPORTANT: Always respond in ${tab.toLang}, regardless of the language the user writes in.\n\n` : "";
          const agentInstruction = `You are a helpful AI assistant with access to tools. Today's date is ${today}. Use tools as needed to answer the user's request.`;
          const sysContent = `${langInstruction}${agentInstruction}${baseSystemPrompt ? "\n\n" + baseSystemPrompt : ""}`;
          if (!tab.history.length || tab.history[0].role !== "system") {
            tab.history.unshift({ role: "system", content: sysContent });
          } else {
            tab.history[0].content = sysContent;

          await runAgentLoop(tab, tabId, vendor, model, thinking);

          await runStreaming(tab, tabId, vendor, model, thinking);

    function addMessage(role, text, tabId = activeTabId) {
      const tab = tabs[tabId];
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (role === "assistant" && text === "…") {

    // ── Streaming ────────────────────────────────────────────────────────────────
    const activeStreams = {}; // tabId → sid

    function cancelCurrentStream(tabId) {
      const sid = activeStreams[tabId];
      if (sid) {
        ipcRenderer.send("cancel-stream", sid);
        delete activeStreams[tabId];
      }
    }

    function runStreaming(tab, tabId, vendor, model, thinkingEl) {
      return new Promise((resolve, reject) => {
        let reply = "";
        const sid = "s" + Date.now() + Math.random();
        activeStreams[tabId] = sid;

        const onChunk = (_e, id, chunk) => { if (id !== sid) return; reply += chunk; renderAssistantContent(thinkingEl, reply, vendor); if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight; };
        const onDone  = (_e, id, full)  => { if (id !== sid) return; cleanup(); finishAssistant(tab, tabId, thinkingEl, full, vendor); resolve(); };
        const onError = (_e, id, msg)   => { if (id !== sid) return; cleanup(); reject(new Error(msg)); };

        function cleanup() {
          delete activeStreams[tabId];
          ipcRenderer.removeListener("stream-chunk", onChunk);
          ipcRenderer.removeListener("stream-done",  onDone);
          ipcRenderer.removeListener("stream-error", onError);
          ipcRenderer.removeListener("stream-tool-calls", onTools);
        }
        const onTools = (_e, id) => { if (id !== sid) return; cleanup(); reject(new Error("Unexpected tool call in non-agent mode")); };

        ipcRenderer.on("stream-chunk",       onChunk);
        ipcRenderer.on("stream-done",       onDone);
        ipcRenderer.on("stream-error",      onError);
        ipcRenderer.on("stream-tool-calls", onTools);
        ipcRenderer.send("chat-stream", { messages: tab.history, vendor, model, agentMode: false, sid });
      });
    }

    // ── Twemoji: replace non-BMP emoji with SVG images (fallback) ──────────────
    const TWEMOJI_BASE = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/";

    /**
     * Detect whether the system can render color emoji natively.
     * Draws a known emoji to a canvas and checks for color pixels.
     * Returns true if color emoji font is available (macOS, Windows, Linux with Noto Color Emoji).
     */
    const hasColorEmoji = (() => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 20;
        canvas.height = 20;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.textBaseline = "top";
        ctx.font = "16px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
        ctx.fillText("\uD83D\uDE00", 0, 0); // 😀
        const data = ctx.getImageData(0, 0, 20, 20).data;
        // Check for any pixel with color (not purely grayscale/transparent)
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] > 0) { // non-transparent pixel
            const r = data[i], g = data[i + 1], b = data[i + 2];
            // Color emoji will have varied RGB values; monochrome will be uniform
            if (r !== g || g !== b) return true;
          }
        }
        return false;
      } catch {
        return true; // Assume color emoji available if detection fails
      }
    })();

    /**
     * Replaces non-BMP Unicode characters (emoji) in an HTML string with inline
     * <img> tags referencing Twemoji SVG images from a CDN.
     * Only performs replacement if the system lacks a color emoji font.
     * Handles surrogate pairs, ZWJ sequences, variation selectors, skin tone
     * modifiers, and flag (regional indicator) sequences.
     */
    function replaceEmoji(html) {
      if (!html || hasColorEmoji) return html;
      let result = "";
      let i = 0;
      while (i < html.length) {
        const c = html.charCodeAt(i);

        // Check for high surrogate (start of a supplementary character)
        if (c >= 0xD800 && c <= 0xDBFF && i + 1 < html.length) {
          const lo = html.charCodeAt(i + 1);
          if (lo >= 0xDC00 && lo <= 0xDFFF) {
            // Collect the full emoji sequence
            const codePoints = [];
            let cp = ((c - 0xD800) << 10) + (lo - 0xDC00) + 0x10000;
            codePoints.push(cp);
            i += 2;

            // Continue collecting joined characters
            while (i < html.length) {
              let nextCp = -1;
              let advance = 0;
              const nc = html.charCodeAt(i);

              if (nc >= 0xD800 && nc <= 0xDBFF && i + 1 < html.length) {
                const nlo = html.charCodeAt(i + 1);
                if (nlo >= 0xDC00 && nlo <= 0xDFFF) {
                  nextCp = ((nc - 0xD800) << 10) + (nlo - 0xDC00) + 0x10000;
                  advance = 2;
                }
              } else if (nc === 0x200D || nc === 0xFE0F || nc === 0xFE0E || nc === 0x20E3) {
                nextCp = nc;
                advance = 1;
              }

              if (nextCp === -1) break;

              // Is this a valid continuation?
              if (nextCp === 0x200D || nextCp === 0xFE0F || nextCp === 0xFE0E
                  || (nextCp >= 0x1F3FB && nextCp <= 0x1F3FF)   // skin tones
                  || (nextCp >= 0xE0020 && nextCp <= 0xE007F)   // tag characters
                  || (nextCp >= 0x1F1E6 && nextCp <= 0x1F1FF)   // regional indicators
                  || codePoints[codePoints.length - 1] === 0x200D // after ZWJ, allow next emoji
                  || (nextCp >= 0x1F1E6 && nextCp <= 0x1F1FF)) { // flag pairs
                codePoints.push(nextCp);
                i += advance;
              } else {
                break;
              }
            }

            // Build filename from code points (hex, joined by -)
            const filename = codePoints.map(p => p.toString(16)).join("-");
            const alt = String.fromCodePoint(...codePoints);
            const fallback = filename.replace(/-fe0f/g, "");
            result += `<img src="${TWEMOJI_BASE}${filename}.svg" alt="${alt.replace(/"/g, "&quot;")}" class="emoji" draggable="false" onerror="this.onerror=null;this.src='${TWEMOJI_BASE}${fallback}.svg';">`;
            continue;
          }
        }
        result += html.charAt(i);
        i++;
      }
      return result;
    }

    function renderAssistantContent(el, reply, vendor) {
      let text = reply || "";
      const supportsThinking = true;

      // When Display Model Activity is off, strip thinking content
      if (!(supportsThinking && displayModelActivity)) {
        let cleaned = text.replace(/<think>[\s\S]*?<\/think>/gi, "");
        cleaned = cleaned.replace(/<thought>[\s\S]*?<\/thought>/gi, "");
        // Handle unclosed thinking blocks (still streaming) — strip from <think> to end
        cleaned = cleaned.replace(/<think>[\s\S]*/gi, "");
        cleaned = cleaned.replace(/<thought>[\s\S]*/gi, "");
        cleaned = cleaned.trim();
        if (!cleaned) {
          // All content so far is thinking — keep the thinking indicator as-is
          if (!el.classList.contains("thinking-indicator")) {
            el.classList.add("thinking-indicator");
            el.innerHTML = "";
            const img = document.createElement("img");
            img.src = "resources/app_icon.png";
            el.appendChild(img);
            const span = document.createElement("span");
            span.className = "thinking-text";
            span.textContent = "Thinking...";
            el.appendChild(span);
          }
          return;
        }
        // Has real content — render it without thinking blocks
        el.classList.remove("thinking-indicator");
        el.innerHTML = replaceEmoji(marked.parse(cleaned));
        addCodeCopyButtons(el);
        addTableToolbars(el);
        addMathBlockToolbars(el);
        return;
      }

      // Display Model Activity is ON — show thinking blocks
      el.classList.remove("thinking-indicator");
      el.innerHTML = "";
      // Normalize Google Gemini <thought> tags to <think> for consistent handling
      text = text.replace(/<thought>/gi, "<think>").replace(/<\/thought>/gi, "</think>");
      const lower = text.toLowerCase();
      let pos = 0;
      while (pos < text.length) {
        const start = lower.indexOf("<think>", pos);
        if (start === -1) {
          const contentText = text.slice(pos);
          if (contentText || !el.children.length) {
            const content = document.createElement("div");
            content.innerHTML = replaceEmoji(marked.parse(contentText || text));
            el.appendChild(content);
          }
          break;
        }
        const before = text.slice(pos, start);
        if (before) {
          const content = document.createElement("div");
          content.innerHTML = replaceEmoji(marked.parse(before));
          el.appendChild(content);
        }
        const bodyStart = start + "<think>".length;
        const end = lower.indexOf("</think>", bodyStart);
        const isOpen = end === -1;
        const thinkText = isOpen ? text.slice(bodyStart) : text.slice(bodyStart, end);
        const think = document.createElement("div");
        think.className = "think-block";
        const title = document.createElement("div");
        title.className = "think-block-title";
        title.textContent = isOpen ? "Model thinking…" : "Model thinking";
        const body = document.createElement("div");
        body.className = "think-block-body";
        body.innerHTML = replaceEmoji(marked.parse(thinkText.trim() || "…"));
        think.append(title, body);
        el.appendChild(think);
        if (isOpen) break;
        pos = end + "</think>".length;
      }
      addCodeCopyButtons(el);
      addTableToolbars(el);
      addMathBlockToolbars(el);
    }

    function finishAssistant(tab, tabId, el, reply, vendor) {
      renderAssistantContent(el, reply, vendor);
      renderMermaidDiagrams(el);
      el.appendChild(makeActions(reply));
      tab.history.push({ role: "assistant", content: reply });
      tab.chatLog.push({ role: "assistant", content: reply, images: [] });
      tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
      markUnsaved(tabId);
    }

    function addAgentActivity(tabId, title, detail = "", kind = "") {
      if (!displayModelActivity) return null;
      const card = document.createElement("div");
      card.className = `agent-activity ${kind}`.trim();
      const header = document.createElement("div");
      header.className = "agent-activity-header";
      header.textContent = title;
      card.appendChild(header);
      if (detail) {
        const body = document.createElement("div");
        body.className = "agent-activity-detail";
        body.textContent = detail;
        card.appendChild(body);
      }
      tabs[tabId].container.appendChild(card);
      if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
      return card;
    }

    function summarizeForActivity(value, max = 1200) {
      const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      return text.length > max ? text.slice(0, max) + `\n… (${text.length - max} more characters)` : text;
    }

    // ── Agentic loop ─────────────────────────────────────────────────────────────
    async function runAgentLoop(tab, tabId, vendor, model, thinkingEl) {
      const MAX_TURNS = 20;
      let turns = 0;
      let currentEl = thinkingEl;
      addAgentActivity(tabId, "Agent started", `${vendor} / ${model}`);

      try {
      while (turns++ < MAX_TURNS) {
        addAgentActivity(tabId, `Agent turn ${turns}`, "Waiting for model response…");
        let reply = "";
        const toolCalls = await new Promise((resolve, reject) => {
          reply = "";
          const sid = "s" + Date.now() + Math.random();
          activeStreams[tabId] = sid;

          const onChunk = (_e, id, chunk) => {
            if (id !== sid) return;
            reply += chunk;
            currentEl.classList.remove("thinking-indicator");
            renderAssistantContent(currentEl, reply, vendor);
            if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
          };
          const onDone  = (_e, id, full)  => { if (id !== sid) return; cleanup(); addAgentActivity(tabId, "Agent completed", "Final response received."); currentEl.style.display = ""; finishAssistant(tab, tabId, currentEl, full, vendor); resolve(null); };
          const onError = (_e, id, msg)   => { if (id !== sid) return; cleanup(); addAgentActivity(tabId, "Agent error", msg, "error"); reject(new Error(msg)); };
          const onTools = (_e, id, calls) => {
            if (id !== sid) return;
            cleanup();
            addAgentActivity(tabId, `Model requested ${calls.length} tool${calls.length === 1 ? "" : "s"}`, calls.map(c => `${c.name}(${summarizeForActivity(c.args, 240)})`).join("\n\n"));
            if (reply.trim()) {
              currentEl.style.display = "";
              renderAssistantContent(currentEl, reply, vendor);
              renderMermaidDiagrams(currentEl);
              currentEl.appendChild(makeActions(reply));
              tab.chatLog.push({ role: "assistant", content: reply, images: [] });
              tab.chatLog[tab.chatLog.length - 1].timestamp = nowEpoch();
              markUnsaved(tabId);
            }
            resolve(calls);
          };

          function cleanup() {
            delete activeStreams[tabId];
            ipcRenderer.removeListener("stream-chunk",      onChunk);
            ipcRenderer.removeListener("stream-done",       onDone);
            ipcRenderer.removeListener("stream-error",      onError);
            ipcRenderer.removeListener("stream-tool-calls", onTools);
          }

          ipcRenderer.on("stream-chunk",       onChunk);
          ipcRenderer.on("stream-done",       onDone);
          ipcRenderer.on("stream-error",      onError);
          ipcRenderer.on("stream-tool-calls", onTools);
          ipcRenderer.send("chat-stream", { messages: tab.history, vendor, model, agentMode: true, sid });
        });

        if (!toolCalls) break; // model gave a final text response

        // push assistant tool-call message to history
        if (vendor === "anthropic") {
          const assistantContent = [];
          if (reply.trim()) assistantContent.push({ type: "text", text: reply });
          assistantContent.push(...toolCalls.map(tc => ({ type: "tool_use", id: tc.id, name: tc.name, input: tc.args })));
          tab.history.push({ role: "assistant", content: assistantContent });
        } else {
          tab.history.push({ role: "assistant", content: null, tool_calls: toolCalls.map(tc => ({ id: tc.id, type: "function", function: { name: tc.name, arguments: JSON.stringify(tc.args) } })) });
        }

        // show approval cards and collect results
        const toolResults = [];
        // hide the thinking element before showing approval cards unless it contains streamed text/thinking
        if (currentEl.classList.contains("thinking-indicator") || !currentEl.textContent.trim()) currentEl.style.display = "none";
        for (const tc of toolCalls) {
          const approved = await showToolApproval(tab, tabId, tc);
          let result;
          if (approved) {
            addAgentActivity(tabId, `Running tool: ${tc.name}`, summarizeForActivity(tc.args, 800));
            const { ok, result: r } = await ipcRenderer.invoke("agent-execute-tool", { tool: tc.name, args: tc.args });
            result = ok ? r : `Error: ${r}`;
            addAgentActivity(tabId, `Tool ${ok ? "completed" : "failed"}: ${tc.name}`, summarizeForActivity(result), ok ? "" : "error");
            showToolResult(tab, tabId, tc, result);
          } else {
            result = "User denied this tool call.";
            addAgentActivity(tabId, `Tool denied: ${tc.name}`);
            showToolDenied(tab, tabId, tc);
          }
          if (vendor === "anthropic") {
            toolResults.push({ type: "tool_result", tool_use_id: tc.id, content: result });
          } else if (vendor === "google") {
            toolResults.push({ role: "tool", tool_call_id: tc.id, name: tc.name, content: result });
          } else {
            toolResults.push({ role: "tool", tool_call_id: tc.id, content: result });
          }
        }

        // push tool results to history
        if (vendor === "anthropic") {
          tab.history.push({ role: "user", content: toolResults });
        } else {
          for (const r of toolResults) tab.history.push(r);
        }

        // next turn
        currentEl = addMessage("assistant", "…", tabId);
      }
      // clean up any dangling thinking indicator if loop exited without a final response
      if (turns > MAX_TURNS) addAgentActivity(tabId, "Agent stopped", `Reached maximum turn limit (${MAX_TURNS}).`, "error");
      if (currentEl.classList.contains("thinking-indicator")) currentEl.style.display = "none";
      } catch (err) {
        currentEl.style.display = "";
        currentEl.classList.remove("thinking-indicator");
        currentEl.className = "msg error";
        currentEl.textContent = "Error: " + err.message;
        throw err; // re-throw so send()'s catch can clean up chatLog
      }
    }

    function showToolApproval(tab, tabId, tc) {
      return new Promise(resolve => {
        const card = document.createElement("div");
        card.className = "tool-card";
        const argsStr = JSON.stringify(tc.args, null, 2);
        card.innerHTML = `<div class="tool-card-header">⚡ ${tc.name}</div><div class="tool-card-args">${argsStr}</div><div class="tool-card-btns"><button class="tool-allow-btn">Allow</button><button class="tool-deny-btn">Deny</button></div>`;
        tabs[tabId].container.appendChild(card);
        if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
        card.querySelector(".tool-allow-btn").addEventListener("click", () => { card.querySelector(".tool-card-btns").remove(); resolve(true); });
        card.querySelector(".tool-deny-btn").addEventListener("click",  () => { card.querySelector(".tool-card-btns").remove(); card.classList.add("denied"); resolve(false); });
      });
    }

    function showToolResult(tab, tabId, tc, result) {
      const card = tabs[tabId].container.querySelector(".tool-card:not(.executed):not(.denied)");
      if (card) {
        card.classList.add("executed");
        card.querySelector(".tool-card-header").textContent = `✓ ${tc.name}`;
        const res = document.createElement("div");
        res.className = "tool-card-result";
        res.textContent = result.slice(0, 2000) + (result.length > 2000 ? "…" : "");
        card.appendChild(res);
        if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    function showToolDenied(tab, tabId, tc) {
      const card = tabs[tabId].container.querySelector(".tool-card:not(.executed):not(.denied)");
      if (card) {
        card.classList.add("denied");
        card.querySelector(".tool-card-header").textContent = `✗ ${tc.name} (denied)`;
        if (tabId === activeTabId) chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    function makeActions(plainText) {
      const bar = document.createElement("div");
      bar.className = "msg-actions";

      const copy = btn("Copy", `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`);
      const copyIconSvg = copy.innerHTML;
      const checkIconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      copy.addEventListener("click", () => {
        ipcRenderer.invoke("copy-to-clipboard", plainText);
        copy.innerHTML = checkIconSvg;
        setTimeout(() => {
          copy.innerHTML = copyIconSvg;
        }, 800);
      });

      const speak = btn("Speak", `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`);
      speak.addEventListener("click", () => {
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();
          speak.classList.remove("speaking");
          return;
        }
        const utter = new SpeechSynthesisUtterance(plainText);
        utter.lang = LANG_TAGS[toLangSel.value] || "en";
        if (ttsVoice) {
          const v = speechSynthesis.getVoices().find(v => v.name === ttsVoice);
          if (v) utter.voice = v;
        }
        utter.onend = () => speak.classList.remove("speaking");
        utter.onerror = () => speak.classList.remove("speaking");
        speak.classList.add("speaking");
        speechSynthesis.speak(utter);
      });

      bar.append(copy, speak);
      return bar;
    }

        if (pre.querySelector(".code-toolbar")) return;

        const toolbar = document.createElement("div");
        toolbar.className = "code-toolbar";

        const code = pre.querySelector("code");
        const textContent = () => code ? code.innerText : pre.innerText;

        const langClass = code?.className?.match(/language-(\S+)/);
        const lang = langClass ? langClass[1] : "";

        const copyBtn = document.createElement("button");
        copyBtn.title = "Copy code";
        copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

          setTimeout(() => {
            copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          }, 1500);
        });

        const dlBtn = document.createElement("button");
        dlBtn.title = "Download code";
        dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
        dlBtn.addEventListener("click", async () => {
          const { filePath } = await ipcRenderer.invoke("save-code-block", { code: textContent(), lang });
          if (filePath) {

            setTimeout(() => {

            }, 1500);
          }

        toolbar.append(copyBtn, dlBtn);
        pre.appendChild(toolbar);

    function addTableToolbars(el) {
      el.querySelectorAll(".table-wrap").forEach(wrap => {
        if (wrap.querySelector(".table-toolbar")) return;

        const table = wrap.querySelector("table");
        if (!table) return;

        const toolbar = document.createElement("div");
        toolbar.className = "table-toolbar";

        // Convert table back to Markdown
        function tableToMarkdown() {
          const rows = table.querySelectorAll("tr");
          if (!rows.length) return "";
          const lines = [];
          const headerCells = rows[0].querySelectorAll("th, td");
          const headers = Array.from(headerCells).map(c => c.textContent.trim());
          lines.push("| " + headers.join(" | ") + " |");
          lines.push("| " + headers.map(() => "---").join(" | ") + " |");
          for (let i = 1; i < rows.length; i++) {
            const cells = rows[i].querySelectorAll("td, th");
            const vals = Array.from(cells).map(c => c.textContent.trim());
            lines.push("| " + vals.join(" | ") + " |");
          }
          return lines.join("\n");
        }

        const copyBtn = document.createElement("button");
        copyBtn.title = "Copy table as Markdown";
        copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        copyBtn.addEventListener("click", async () => {
          await ipcRenderer.invoke("copy-to-clipboard", tableToMarkdown());
          copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          setTimeout(() => {
            copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          }, 1500);
        });

        const dlBtn = document.createElement("button");
        dlBtn.title = "Download table as CSV";
        dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
        dlBtn.addEventListener("click", async () => {
          const rows = table.querySelectorAll("tr");
          const csvLines = [];
          for (const row of rows) {
            const cells = row.querySelectorAll("th, td");
            const values = Array.from(cells).map(c => {
              const val = c.textContent.trim();
              return val.includes(",") || val.includes('"') || val.includes("\n") ? '"' + val.replace(/"/g, '""') + '"' : val;
            });
            csvLines.push(values.join(","));
          }
          const { filePath } = await ipcRenderer.invoke("save-code-block", { code: csvLines.join("\n"), lang: "csv" });
          if (filePath) {
            dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            setTimeout(() => {
              dlBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
            }, 1500);
          }
        });

        toolbar.append(copyBtn, dlBtn);
        wrap.appendChild(toolbar);
      });
    }

    function addMathBlockToolbars(el) {
      el.querySelectorAll(".math-block-wrap").forEach(wrap => {
        if (wrap.querySelector(".math-block-toolbar")) return;

        const latex = wrap.getAttribute("data-latex") || "";
        const toolbar = document.createElement("div");

          setTimeout(() => {
            copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

        });

        const dlBtn = document.createElement("button");

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
